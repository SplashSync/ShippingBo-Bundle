################################################################
# Include Pipeline Templates
include:
    - remote: 'https://raw.githubusercontent.com/BadPixxel/Php-Sdk/2.0/gitlab/php/defaults.yaml'
    - remote: 'https://raw.githubusercontent.com/BadPixxel/Php-Sdk/2.0/gitlab/pages.yaml'

################################################################
# Quality Tests
################################################################

################################################################################
# PHP 8.2
quality:php-8.2:
    extends:  .quality
    image:    registry.gitlab.com/badpixxel-projects/php-sdk:php-8.2

################################################################################
# PHP 8.1
quality:php-8.1:
    extends:  .quality
    image: registry.gitlab.com/badpixxel-projects/php-sdk:php-8.1

################################################################
# Functional Tests
################################################################
functional:
    image:      docker:latest
    stage:      Functional
    retry:      1
    tags:
        - Dedicated-Docker
    services:
        - docker:dind
    ################################################################################
    # Install & Configure Environment
    before_script:
        # Install Git, Bash, Curl
        - apk add --no-cache curl bash git
        # Install & Build Docker Compose
        - curl -s https://raw.githubusercontent.com/BadPixxel/Php-Sdk/2.0/toolkit/build.sh  | bash

    ################################################################################
    # Run Test Script
    script:
        # Wait for container to Start
        - sleep 10
        - docker compose exec -T toolkit curl http://openapi/
        # Execute PhpUnit Tests
        - docker compose exec -T toolkit php vendor/bin/phpunit tests/Controller/S00MinimalObjectsTest.php
        - curl -s https://raw.githubusercontent.com/BadPixxel/Php-Sdk/2.0/toolkit/phpunit.sh  | bash
        # Build Splash Manifest
        - curl -s https://raw.githubusercontent.com/BadPixxel/Php-Sdk/2.0/toolkit/manifest.sh  | bash

    ################################################################################
    # Run After Script
    after_script:
        - curl -s https://raw.githubusercontent.com/BadPixxel/Php-Sdk/2.0/toolkit/after.sh  | bash
    artifacts:
        paths:
            - logs
            - manifest
            - reports
        reports:
            junit: "*-report.xml"

################################################################
# Build Bridge Connector via Bridge Builder
build:bridge:
    image:          registry.gitlab.com/badpixxel-projects/php-sdk:php-8.3
    stage:          Builds
    tags:
        - Dedicated
    before_script:
        - composer update
    script:
        ################################################################
        # Build native + 2.0 versions into dist/
        - php -d phar.readonly=0 vendor/bin/bridge-builder --native
        - php -d phar.readonly=0 vendor/bin/bridge-builder
        ################################################################
        # Publish .splx to GitLab Generic Package Registry (on tag only)
        - |
            if [ -n "$CI_COMMIT_TAG" ]; then
              for SPLX in dist/*.splx; do
                FILE=$(basename "$SPLX")
                echo "▶ Uploading $FILE"
                curl --fail \
                     --header "JOB-TOKEN: $CI_JOB_TOKEN" \
                     --upload-file "$SPLX" \
                     "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/connector/${CI_COMMIT_TAG}/${FILE}"
              done
            fi
    artifacts:
        paths:
            - dist/
        expire_in:  1 week
